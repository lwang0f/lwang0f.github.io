{% include base_path %}

<aside class="academic-nav" aria-label="Primary navigation">
  <nav class="academic-nav__links">
    <section class="academic-nav__group" aria-labelledby="nav-navigation">
      <h2 id="nav-navigation">Navigation</h2>
      <ul>
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li>
            <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </section>
  </nav>
</aside>
